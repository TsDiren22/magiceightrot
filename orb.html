<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Magic 8 Ball</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#101014; --fg:#f1f1f4; --muted:#8a8a96;
    --panel:rgba(255,255,255,.04); --line:rgba(255,255,255,.09);
    --die:#1f3fbf; --die-hi:#3558e0;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    background:
      radial-gradient(900px 600px at 50% 20%, #23232c, transparent 70%),
      var(--bg);
    color:var(--fg);
    font-family:'Inter',system-ui,sans-serif;
    display:flex; flex-direction:column; align-items:center;
    padding:32px 16px 48px; gap:24px;
    overflow-x:hidden;
  }
  h1{
    font-family:'Archivo Black',sans-serif; font-weight:400;
    font-size:14px; letter-spacing:.35em; text-transform:uppercase;
    color:var(--muted); margin:0; text-align:center;
  }
  .stage{display:flex;flex-direction:column;align-items:center;gap:22px;width:100%;max-width:560px}

  /* ---- the ball ---- */
  .ball{
    position:relative; width:min(80vw,320px); aspect-ratio:1; border-radius:50%;
    border:none; padding:0; cursor:pointer; flex:none;
    background:
      radial-gradient(circle at 34% 22%, rgba(255,255,255,.55) 0, rgba(255,255,255,.12) 14%, transparent 30%),
      radial-gradient(circle at 70% 85%, rgba(120,120,140,.25), transparent 40%),
      radial-gradient(circle at 42% 38%, #3a3a42 0, #121216 45%, #000 75%);
    box-shadow:
      0 30px 60px rgba(0,0,0,.55),
      0 8px 18px rgba(0,0,0,.4),
      inset 0 -20px 40px rgba(0,0,0,.7);
    transition:transform 180ms ease;
  }
  .ball:hover{transform:scale(1.02)}
  .ball:focus-visible{outline:3px solid #6a8cff;outline-offset:6px}
  .ball.shake{animation:shake .9s cubic-bezier(.36,.07,.19,.97)}
  @keyframes shake{
    0%  {transform:translate(0,0) rotate(0)}
    12% {transform:translate(-14px,6px) rotate(-10deg)}
    26% {transform:translate(14px,-8px) rotate(9deg)}
    40% {transform:translate(-12px,4px) rotate(-7deg)}
    54% {transform:translate(10px,-4px) rotate(6deg)}
    68% {transform:translate(-6px,2px) rotate(-3deg)}
    82% {transform:translate(3px,-1px) rotate(1deg)}
    100%{transform:translate(0,0) rotate(0)}
  }
  .shadow{
    width:min(56vw,220px); height:18px; border-radius:50%; margin-top:-8px;
    background:radial-gradient(closest-side, rgba(0,0,0,.6), transparent);
  }

  /* front "8" disc */
  .eight, .window{
    position:absolute; left:50%; top:50%; border-radius:50%;
    transform:translate(-50%,-50%);
    transition:opacity .35s ease, transform .45s ease;
  }
  .eight{
    width:44%; aspect-ratio:1;
    background:radial-gradient(circle at 40% 35%, #fff, #e6e6ea 70%, #cfcfd6);
    box-shadow:inset 0 -4px 8px rgba(0,0,0,.18), 0 2px 4px rgba(0,0,0,.4);
    display:grid; place-items:center;
    font-family:'Archivo Black',sans-serif; color:#0b0b0e;
    font-size:min(20vw,84px); line-height:1;
  }
  .eight span{transform:translateY(2%)}

  /* answer window */
  .window{
    width:50%; aspect-ratio:1; opacity:0;
    background:radial-gradient(circle at 50% 45%, #0e1440 0, #060822 60%, #020310 100%);
    box-shadow:
      inset 0 0 0 5px #1b1b22,
      inset 0 0 0 7px #34343e,
      inset 0 10px 24px rgba(0,0,0,.8);
    display:grid; place-items:center; overflow:hidden;
    transform:translate(-50%,-50%) scale(.8);
  }
  .ball.revealed .eight{opacity:0; transform:translate(-50%,-50%) scale(.6) rotate(-40deg)}
  .ball.revealed .window{opacity:1; transform:translate(-50%,-50%) scale(1)}

  .die{
    position:relative; width:84%; aspect-ratio:1/.9;
    opacity:0; filter:blur(8px); transform:scale(.7) rotate(14deg);
    transition:opacity 1.1s ease .25s, filter 1.1s ease .25s, transform 1.1s cubic-bezier(.2,.8,.2,1) .25s;
  }
  .ball.revealed .die.up{opacity:1; filter:blur(0); transform:scale(1) rotate(0)}
  .die::before{
    content:""; position:absolute; inset:0;
    clip-path:polygon(0 0,100% 0,50% 100%);
    background:linear-gradient(180deg, var(--die-hi), var(--die) 60%, #16308f);
  }
  .die p{
    position:absolute; left:18%; right:18%; top:8%; height:46%;
    margin:0; display:flex; align-items:center; justify-content:center; text-align:center;
    color:#eef2ff; font-weight:700; text-transform:uppercase;
    font-size:clamp(8px,2.6vw,11.5px); line-height:1.2; letter-spacing:.04em;
    text-shadow:0 0 6px rgba(160,190,255,.55);
  }

  /* ---- question + controls ---- */
  form{display:flex;gap:8px;width:100%;max-width:440px}
  input{
    flex:1; min-width:0; font:inherit; font-size:15px; color:var(--fg);
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:12px 14px;
  }
  input::placeholder{color:var(--muted)}
  input:focus{outline:none;border-color:#6a8cff}
  form button{
    font:inherit; font-weight:700; font-size:14px; letter-spacing:.06em;
    background:#f1f1f4; color:#0b0b0e; border:none; border-radius:12px;
    padding:0 18px; cursor:pointer;
  }
  form button:hover{background:#fff}
  .hint{font-size:13px;color:var(--muted);letter-spacing:.04em;min-height:1.3em;text-align:center}

  /* ---- log ---- */
  .log{width:100%;max-width:560px;border-top:1px solid var(--line);padding-top:18px}
  .log-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .log-head span{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
  .log-head button{
    background:var(--panel);border:1px solid var(--line);color:var(--muted);
    font:inherit;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    padding:6px 12px;border-radius:999px;cursor:pointer
  }
  .log-head button:hover{color:var(--fg);border-color:rgba(255,255,255,.25)}
  ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;
     max-height:320px;overflow-y:auto}
  li{
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:10px 14px;font-size:14px;line-height:1.45;
    display:flex;gap:12px;align-items:baseline
  }
  li time{color:var(--muted);font-size:11px;flex:none;font-variant-numeric:tabular-nums}
  li .q{color:var(--muted);display:block;font-size:13px}
  li .a{font-weight:600}
  li .dot{width:8px;height:8px;border-radius:50%;flex:none;align-self:center}
  .yes{background:#3ccf7a} .maybe{background:#e8b93a} .no{background:#e8574a}
  .empty{color:var(--muted);font-size:13px;padding:4px 2px}

  @media (prefers-reduced-motion:reduce){
    .ball.shake{animation:none}
    *{transition-duration:.01ms !important;transition-delay:0s !important}
  }
</style>
</head>
<body>
  <h1>Magic 8 Ball</h1>
  <div class="stage">
    <button class="ball" id="ball" aria-label="Shake the Magic 8 Ball">
      <div class="eight"><span>8</span></div>
      <div class="window"><div class="die" id="die"><p id="answer"></p></div></div>
    </button>
    <div class="shadow"></div>

    <form id="form" autocomplete="off">
      <input id="q" type="text" maxlength="140" placeholder="Ask a yes or no question…" aria-label="Your question">
      <button type="submit">Shake</button>
    </form>
    <div class="hint" id="hint" role="status" aria-live="polite">ask something, then shake it</div>
  </div>

  <section class="log">
    <div class="log-head">
      <span>Past readings</span>
      <button id="clear" type="button">clear</button>
    </div>
    <ul id="list"></ul>
    <div class="empty" id="empty">no questions asked yet</div>
  </section>

<script>
// Same split as a real Magic 8 Ball: half yes, a quarter maybe, a quarter no.
// Every line still clearly means yes / maybe / no, however cooked the wording.
const YES = [
  // classic 8 ball, translated
  "It's certain, no cap",
  "Decidedly yes. Periodt.",
  "Zero doubt, on god",
  "Yes, fr fr. Lock in.",
  "Trust, you can bank on it",
  "From my POV? Yes, W",
  "Lowkey most likely",
  "Outlook bussin",
  "Yessir",
  "Signs say yes, it's mathing",
  // slang
  "Yes. Bet.",
  "Absolutely, no cap",
  "Huge W. Yes.",
  "It's giving yes",
  "Yes, on everything",
  "Easy dub, go for it",
  "Yes. Let him cook.",
  "Send it. Yes.",
  "Certified yes moment",
  "Yes, and that's facts",
  "Yes, slay",
  "Say less. Yes.",
  "Big yes energy",
  "Yes, it's a lock",
  "Green flag. Yes.",
  "Yes, main character moment",
  "The answer is yes, bestie",
  "Yes, you ate that",
  "Real. Yes.",
  "Yes, that's so valid",
  "Yes. You understood the assignment.",
  "Yes, it's goated",
  "Yes, the vibes are immaculate",
  "Yes, W in the chat",
  "Yesss, periodt",
  // full brainrot
  "Skibidi yes, no cap",
  "Sigma says yes",
  "Yes, +1000 aura",
  "Gyatt-level yes",
  "Yes. Ohio could never.",
  "Fanum approved. Yes.",
  "Mewing through it: yes",
  "Yes, sheeesh",
  "We are so back. Yes.",
  "Rizz level: yes",
  "Chat, is this real? Yes.",
  "Aura farming says yes",
  "Tralalero tralala says yes",
  "Bombardiro approves. Yes.",
  "Six seven? Nah, full yes",
  "Sigma grindset: yes, go",
  "Yes, that's bussin fr",
  "Unspoken rizz says yes",
  "Yes, you're him fr",
  "Skibidi toilet blessed this. Yes.",
  "Yes, peak aura moment",
  "Yes, W rizz on this one",
  "The mogging is real. Yes.",
  "Yes, locked in like a sigma",
  "Yes, no cap, on skibidi"
];
const MAYBE = [
  // classic 8 ball, translated
  "Vibes are hazy, run it back",
  "Not rn bestie, ask later",
  "Can't drop that lore yet",
  "Can't call it rn, ngl",
  "Lock in and ask again",
  // slang
  "Vibes buffering, ask again",
  "Idk fam, ask later",
  "Lowkey unclear, try again",
  "Loading... ask again",
  "The lore isn't out yet",
  "50/50, ask again later",
  "I'm cooked rn, ask again",
  "Chat is split. Ask again.",
  "Unclear, the tea isn't spilled",
  "It's giving maybe. Retry.",
  "Not sure fr, ask again",
  "Hmm. Ask later, bestie.",
  "It's complicated. Ask again.",
  "Can't tell rn, no cap",
  "Touching grass, ask later",
  // full brainrot
  "Brain rotted, ask again",
  "Skibidi signal lost, retry",
  "Rizzing up the answer, ask later",
  "Sigma is thinking. Ask later.",
  "Mewing rn, can't answer",
  "Aura recharging, ask again",
  "Ohio levels of unclear. Retry.",
  "Tung tung tung... ask later",
  "Fanum taxed my answer. Retry.",
  "Six seven. Ask again."
];
const NO = [
  // classic 8 ball, translated
  "Don't count on it, that's delulu",
  "My answer is no. Big L.",
  "The group chat says no",
  "Outlook mid, not looking good",
  "Very doubtful, kinda sus",
  // slang
  "Nah. Hard pass.",
  "No, that's an L",
  "Nope, not it chief",
  "No cap: no.",
  "Red flag. No.",
  "Absolutely not, bestie",
  "It's giving no",
  "No. Touch grass instead.",
  "Big no, fr fr",
  "No, that's mid",
  "Not the vibe. No.",
  "No, the ick is real",
  "Don't. Skill issue.",
  "Nah fam, abort",
  "Delulu isn't the solulu. No.",
  // full brainrot
  "No, -1000 aura",
  "Skibidi no",
  "Sigma says no",
  "Ohio-tier idea. No.",
  "No, you're cooked",
  "Ratio. No.",
  "Nah, it's so over",
  "Fanum taxed. No.",
  "Chat, is this real? No.",
  "No rizz here. Nope."
];
const ANSWERS = [
  ...YES.map(a => ({ a, k: "yes" })),
  ...MAYBE.map(a => ({ a, k: "maybe" })),
  ...NO.map(a => ({ a, k: "no" }))
];

const ball = document.getElementById('ball');
const die = document.getElementById('die');
const answerEl = document.getElementById('answer');
const hint = document.getElementById('hint');
const form = document.getElementById('form');
const qInput = document.getElementById('q');
const list = document.getElementById('list');
const empty = document.getElementById('empty');
const clearBtn = document.getElementById('clear');
const KEY = 'eightball-history-v2';

let history = [];
try { history = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch(e) { history = []; }
if (!Array.isArray(history)) history = [];

let lastIdx = -1;
function pick(){
  let i;
  do { i = Math.floor(Math.random() * ANSWERS.length); } while (i === lastIdx);
  lastIdx = i;
  return ANSWERS[i];
}

function save(){
  try { localStorage.setItem(KEY, JSON.stringify(history.slice(0,60))); } catch(e){}
}

function render(){
  list.innerHTML = '';
  empty.style.display = history.length ? 'none' : 'block';
  for (const item of history){
    const li = document.createElement('li');
    const dot = document.createElement('span');
    dot.className = 'dot ' + item.k;
    const t = document.createElement('time');
    t.textContent = item.t;
    const body = document.createElement('span');
    if (item.q){
      const q = document.createElement('span');
      q.className = 'q';
      q.textContent = item.q;
      body.appendChild(q);
    }
    const a = document.createElement('span');
    a.className = 'a';
    a.textContent = item.a;
    body.appendChild(a);
    li.append(dot, t, body);
    list.appendChild(li);
  }
}

let busy = false;
function shake(){
  if (busy) return;
  busy = true;
  const question = qInput.value.trim();
  hint.textContent = 'shaking…';

  die.classList.remove('up');
  ball.classList.remove('revealed', 'shake');
  void ball.offsetWidth;
  ball.classList.add('shake');

  setTimeout(() => {
    const r = pick();
    answerEl.textContent = r.a;
    ball.classList.add('revealed');
    requestAnimationFrame(() => die.classList.add('up'));
    hint.textContent = r.a;

    const now = new Date();
    history.unshift({ q: question, a: r.a, k: r.k,
      t: now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) });
    history = history.slice(0,60);
    save();
    render();
    qInput.value = '';
    busy = false;
  }, 900);
}

ball.addEventListener('click', shake);
form.addEventListener('submit', e => { e.preventDefault(); shake(); });
clearBtn.addEventListener('click', () => { history = []; save(); render(); });
render();
</script>
</body>
</html>
